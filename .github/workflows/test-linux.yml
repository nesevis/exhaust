name: Tests (Linux)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    container: swift:6.4
    # In container jobs the runner's shell probe can fall back to sh, which rejects the
    # bashisms below (set +o pipefail, PIPESTATUS). The Ubuntu-based swift image has bash.
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v6

      - name: Run tests
        run: |
          mkdir -p .build
          set +o pipefail
          swift test --build-system native --parallel 2>&1 | tee .build/test-output.txt
          exit ${PIPESTATUS[0]}

      - name: Test report
        if: always()
        run: |
          command -v python3 >/dev/null 2>&1 || (apt-get update && apt-get install -y --no-install-recommends python3)
          python3 Scripts/test-report.py .build/test-output.txt
