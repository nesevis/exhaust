name: Explore Harness

on:
  push:
    branches: [main]
  workflow_dispatch:

# The `#explore(time:)` validation harness is a separate package with coverage `.unsafeFlags` on its
# fixture. It runs on its own lane, macOS only, and is excluded from the default `swift test` run.
#
# The harness runs twice. The serial pass (--no-parallel) is the baseline every assertion was
# written against. The parallel pass is the suite recipe the documentation recommends: the fixture
# is instrumented with `trace-pc-guard`, whose per-run context keeps one test's edges out of
# another's attempt, so the suites should pass unserialized with the same inventories and in less
# wall-clock time. A parallel failure with a serial pass points at cross-run leakage (an escaped
# thread, a process-global table) rather than at the search. Both durations land in the job summary
# so the wall-clock gain, or its absence, is visible per run.
jobs:
  explore-harness:
    runs-on: xcode-27

    steps:
      - uses: actions/checkout@v6

      - name: Select Xcode 27
        run: sudo xcode-select -s /Applications/Xcode_27.app/Contents/Developer

      - name: Validate explore command consumer workflow
        run: swift -warnings-as-errors -swift-version 6 PluginTests/test_explore_commands.swift

      - name: Verify real campaigns and failure reporting
        run: swift -warnings-as-errors -swift-version 6 PluginTests/run_real_consumer.swift

      - name: Build harness
        run: swift build --build-system native --package-path ExploreHarness --build-tests

      - name: Run harness serially
        id: serial
        run: |
          START=$(date +%s)
          swift test --build-system native --package-path ExploreHarness --skip-build --no-parallel
          echo "elapsed=$(( $(date +%s) - START ))" >> "$GITHUB_OUTPUT"

      - name: Run harness in parallel
        id: parallel
        if: always()
        run: |
          START=$(date +%s)
          swift test --build-system native --package-path ExploreHarness --skip-build --parallel
          echo "elapsed=$(( $(date +%s) - START ))" >> "$GITHUB_OUTPUT"

      - name: Report elapsed time
        if: always()
        run: |
          SERIAL="${{ steps.serial.outputs.elapsed }}"
          PARALLEL="${{ steps.parallel.outputs.elapsed }}"
          {
            echo "### Explore harness wall clock"
            echo ""
            echo "| pass | outcome | elapsed |"
            echo "|---|---|---|"
            echo "| serial (\`--no-parallel\`) | ${{ steps.serial.outcome }} | ${SERIAL:-n/a} s |"
            echo "| parallel | ${{ steps.parallel.outcome }} | ${PARALLEL:-n/a} s |"
            if [ -n "$SERIAL" ] && [ -n "$PARALLEL" ] && [ "$PARALLEL" -gt 0 ]; then
              echo ""
              echo "Serial / parallel: $(awk "BEGIN { printf \"%.2f\", $SERIAL / $PARALLEL }")×"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Collect crash reports
        if: failure()
        run: |
          REPORT_DIR="$HOME/Library/Logs/DiagnosticReports"
          if [ -d "$REPORT_DIR" ]; then
            echo "### Crash reports" >> "$GITHUB_STEP_SUMMARY"
            for f in "$REPORT_DIR"/*.ips "$REPORT_DIR"/*.crash; do
              [ -f "$f" ] || continue
              echo "#### $(basename "$f")" >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
              head -80 "$f" >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
            done
          fi

  explore-command-linux:
    runs-on: ubuntu-latest
    container: swift:6.4
    steps:
      - uses: actions/checkout@v6
      - name: Validate explore command consumer workflow
        run: swift -warnings-as-errors -swift-version 6 PluginTests/test_explore_commands.swift
      - name: Verify real campaigns and failure reporting
        run: swift -warnings-as-errors -swift-version 6 PluginTests/run_real_consumer.swift

  explore-command-windows:
    name: Explore command (Windows, experimental)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: compnerd/gha-setup-swift@main
        with:
          branch: swift-6.4.0-release
          tag: 6.4.0-RELEASE
      # The interpreter's JIT cannot resolve Foundation or WinSDK symbols on Windows, so compile each script and run the executable.
      - name: Validate explore command consumer workflow
        shell: pwsh
        run: |
          swiftc -warnings-as-errors -swift-version 6 PluginTests/test_explore_commands.swift -o "$env:RUNNER_TEMP\test_explore_commands.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:RUNNER_TEMP\test_explore_commands.exe"
          exit $LASTEXITCODE
      - name: Verify real campaigns and failure reporting
        shell: pwsh
        run: |
          swiftc -warnings-as-errors -swift-version 6 PluginTests/run_real_consumer.swift -o "$env:RUNNER_TEMP\run_real_consumer.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:RUNNER_TEMP\run_real_consumer.exe"
          exit $LASTEXITCODE
      # Measures Windows edge coverage with the configuration that builds there: the explore command, instrumenting Parser only, in debug (release runners never load their test DLL). Prints the summary's "Coverage: X of Y instrumented edges hit" line: Y is how many edges registered at load, X how many the run recorded. (-sanitize=undefined is rejected for x86_64-unknown-windows-msvc, and whole-graph -sanitize=fuzzer-no-link crashes swift-frontend compiling swift-issue-reporting.)
      - name: Measure Windows edge coverage
        if: always()
        timeout-minutes: 30
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          $consumer = (Resolve-Path PluginTests/RealConsumer).Path
          $output = @(& swift package --package-path $consumer explore --instrument Parser --test-target ParserTests --configuration debug --filter instrumentedProperty --time 5 2>&1 | ForEach-Object { "$_" })
          "exit code: $LASTEXITCODE"
          $output | Where-Object { $_ -match "error|instrumentedProperty|coveredEdges|Running|Test run" -and $_ -notmatch "^\[\d+ / \d+\]" } | Select-Object -Last 30 | ForEach-Object { "  campaign: $_" }
          $attachmentsLine = $output | Where-Object { $_ -like "Attachments: *" } | Select-Object -Last 1
          if ($attachmentsLine) {
            $attachments = $attachmentsLine.Substring("Attachments: ".Length).Trim()
            $summaries = @(Get-ChildItem -Path $attachments -Recurse -Filter "explore-time-summary.txt" -ErrorAction SilentlyContinue)
            if ($summaries.Count -eq 0) { "  no summary attachment in $attachments" }
            foreach ($summary in $summaries) {
              Get-Content $summary.FullName | Select-Object -First 25 | ForEach-Object { "  summary: $_" }
            }
          } else {
            "  no attachments path in the command output"
          }

          # Whole-graph -sanitize=fuzzer-no-link crashed swift-frontend on swift-issue-reporting. Swift prints LLVM's reason as notes after "fatal error encountered during compilation", so keep the full output and print the lines around it.
          "== Whole-graph instrumentation of IssueReporting"
          $crashLog = Join-Path $env:RUNNER_TEMP "issuereporting-coverage.log"
          & swift build --package-path $consumer --scratch-path (Join-Path $env:RUNNER_TEMP "issuereporting-coverage") --disable-sandbox --target IssueReporting -Xswiftc "-sanitize=fuzzer-no-link" -Xswiftc "-sanitize-coverage=edge,trace-pc-guard,pc-table" > $crashLog 2>&1
          "exit code: $LASTEXITCODE"
          $lines = @(Get-Content $crashLog)
          $fatal = @(0..($lines.Count - 1) | Where-Object { $lines[$_] -match "fatal error encountered|LLVM ERROR|Assertion|Stack dump" })
          if ($fatal.Count -eq 0) {
            $lines | Select-Object -Last 40 | ForEach-Object { "  build: $_" }
          } else {
            $first = [Math]::Max(0, $fatal[0] - 10)
            $last = [Math]::Min($lines.Count - 1, $fatal[0] + 40)
            $lines[$first..$last] | ForEach-Object { "  build: $($_.Substring(0, [Math]::Min(400, $_.Length)))" }
          }
          exit 0

      # Diagnostic for an instrumented campaign whose discovery lists no tests. Each probe runs even if an earlier one fails:
      # 1. Where the toolchain keeps the x64 Testing.dll and XCTest.dll (usr\bin64), so direct launches can load them.
      # 2. Which imported DLLs of the campaign's Products binaries are neither beside them nor on PATH.
      # 3. What each campaign runner lists when launched directly, for XCTest and for Swift Testing: 0x490 from Swift Testing means it found no tests.
      # 4. Which sections each campaign test DLL contains (.sw5test holds Swift Testing's records).
      # 5. What the uninstrumented debug runner lists when launched directly, as a control.
      # 6. Every DLL each test runner imports: a runner that does not import its test DLL never loads it, so Swift Testing finds no tests in it.
      - name: Diagnose instrumented test runners
        if: failure()
        timeout-minutes: 15
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          function Invoke-Runner($path, $arguments) {
            "-- $(Split-Path -Leaf $path) $arguments"
            $output = Join-Path $env:RUNNER_TEMP "$([IO.Path]::GetFileNameWithoutExtension($path))-$([Guid]::NewGuid()).out"
            $process = Start-Process -FilePath $path -ArgumentList $arguments -WorkingDirectory (Split-Path $path) -NoNewWindow -PassThru -RedirectStandardOutput $output -RedirectStandardError "$output.err"
            if ($process.WaitForExit(120000)) {
              "exit code: 0x{0:X8}" -f $process.ExitCode
              Get-Content $output -TotalCount 20 -ErrorAction SilentlyContinue | ForEach-Object { "  out: $_" }
              Get-Content "$output.err" -TotalCount 20 -ErrorAction SilentlyContinue | ForEach-Object { "  err: $_" }
            } else {
              $process.Kill()
              "timed out after 120 s"
            }
          }
          $consumer = (Resolve-Path PluginTests/RealConsumer).Path
          $runners = @(Get-ChildItem -Path "$consumer\.build\plugins\Explore\outputs" -Recurse -Filter "*-test-runner.exe" -ErrorAction SilentlyContinue)
          if ($runners.Count -eq 0) { "No campaign test runner executables found"; exit 0 }
          $products = $runners[0].DirectoryName
          "Products: $products"
          $readobj = Get-Command llvm-readobj -ErrorAction SilentlyContinue

          "== 1. Toolchain test-framework DLLs"
          $swiftRoot = Join-Path $env:LOCALAPPDATA "Programs\Swift"
          foreach ($library in "Testing.dll", "XCTest.dll") {
            $locations = @(Get-ChildItem -Path $swiftRoot -Recurse -Force -FollowSymlink -Filter $library -ErrorAction SilentlyContinue | Where-Object { $_.DirectoryName -like "*\usr\bin64" })
            if ($locations.Count -eq 0) { "could not find $library under $swiftRoot" }
            foreach ($location in $locations) {
              "found $library in $($location.DirectoryName)"
              $env:Path = "$($location.DirectoryName);$env:Path"
            }
          }

          "== 2. Unresolved imports"
          if ($readobj) {
            foreach ($binary in Get-ChildItem -Path $products -Include "*.exe", "*.dll" -Recurse -Depth 0) {
              $imports = & $readobj.Source --coff-imports $binary.FullName | Select-String "Name: (\S+\.dll)" | ForEach-Object { $_.Matches[0].Groups[1].Value }
              foreach ($import in $imports | Sort-Object -Unique) {
                if ($import -like "api-ms-win-*" -or $import -like "ext-ms-*") { continue }
                $found = (Test-Path (Join-Path $products $import)) -or ($env:Path.Split(";") | Where-Object { $_ -and (Test-Path (Join-Path $_ $import)) })
                if (-not $found) { "MISSING for $($binary.Name): $import" }
              }
            }
          } else {
            "No llvm-readobj to list imports"
          }

          "== 3. Campaign runners, launched directly"
          foreach ($runner in $runners) {
            Invoke-Runner $runner.FullName "--list-tests"
            Invoke-Runner $runner.FullName "--testing-library swift-testing --list-tests"
          }

          "== 4. Campaign test DLL sections"
          if ($readobj) {
            foreach ($library in "ParserTests.dll", "BaselineTests.dll") {
              $names = & $readobj.Source --sections (Join-Path $products $library) | Select-String "Name: (\S+)" | ForEach-Object { $_.Matches[0].Groups[1].Value }
              "$library sections: $(($names | Sort-Object -Unique) -join ' ')"
            }
          }

          "== 5. Uninstrumented debug runner, launched directly"
          $debugRunner = Get-ChildItem -Path "$consumer\.build" -Recurse -Filter "ParserTests-test-runner.exe" -ErrorAction SilentlyContinue | Where-Object { $_.FullName -notlike "*\plugins\*" -and $_.FullName -like "*Debug*" } | Select-Object -First 1
          if ($debugRunner) {
            Invoke-Runner $debugRunner.FullName "--testing-library swift-testing --list-tests"
          } else {
            "No uninstrumented debug runner found"
          }

          "== 6. Test runner imports"
          if ($readobj) {
            foreach ($runner in Get-ChildItem -Path "$consumer\.build" -Recurse -Filter "*-test-runner.exe" -ErrorAction SilentlyContinue) {
              $imports = & $readobj.Source --coff-imports $runner.FullName | Select-String "Name: (\S+\.dll)" | ForEach-Object { $_.Matches[0].Groups[1].Value }
              "$($runner.FullName.Substring($consumer.Length)): $(($imports | Where-Object { $_ -notlike 'api-ms-win-*' } | Sort-Object -Unique) -join ' ')"
            }
          } else {
            "No llvm-readobj to list imports"
          }
          exit 0
