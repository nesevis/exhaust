name: Explore Harness

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "Sources/ExhaustExploreCommand/**"
      - "Sources/ExhaustSupport/**"
      - "Sources/Exhaust/Macros/Explore/**"
      - "Sources/Exhaust/StateMachine/Shared/StateMachineRunner+Time.swift"
      - "Sources/ExhaustCore/Runners/Fuzzing/**"
      - "Sources/ExhaustCoverageRuntime/**"
      - "Plugins/Explore/**"
      - "PluginTests/**"
      - "ExploreHarness/**"
      - "Package.swift"
      - ".github/workflows/explore-harness.yml"
  workflow_dispatch:

# The `#explore(time:)` validation harness is a separate package. CI builds and runs it through
# `swift package explore`, the path users follow, so every harness assertion also exercises the
# command's manifest overlay, recorder selection, campaign reports, and event stream.
# EXHAUST_HARNESS_COMMAND_COVERAGE=1 removes the harness's own manifest flags so the command's
# recorder is the only one in the build.
#
# The harness runs twice. The serial pass (--no-parallel, inline-8bit-counters) is the baseline every
# assertion was written against. The parallel pass uses the default trace-pc-guard recorder, whose
# per-run context keeps one test's edges out of another's attempt, so the suites should pass
# unserialized with the same inventories and in less wall-clock time. A parallel failure with a
# serial pass points at cross-run leakage (an escaped thread, a process-global table) rather than at
# the search. Both durations land in the job summary so the wall-clock gain, or its absence, is
# visible per run.
jobs:
  explore-harness:
    runs-on: xcode-27

    steps:
      - uses: actions/checkout@v6

      - name: Select Xcode 27
        run: sudo xcode-select -s /Applications/Xcode_27.app/Contents/Developer

      - name: Validate explore command consumer workflow
        run: swift -warnings-as-errors -swift-version 6 PluginTests/test_explore_commands.swift

      - name: Verify real campaigns and failure reporting
        run: swift -warnings-as-errors -swift-version 6 PluginTests/run_real_consumer.swift

      - name: Run harness serially
        id: serial
        env:
          EXHAUST_HARNESS_COMMAND_COVERAGE: "1"
        run: |
          START=$(date +%s)
          status=0
          for target in ExploreTests SpecTests; do
            swift package --package-path ExploreHarness explore \
              --instrument ExploreFixture --instrument SpecFixture --instrument SpecTrapProbe \
              --test-target "$target" --configuration debug --no-parallel || status=1
          done
          echo "elapsed=$(( $(date +%s) - START ))" >> "$GITHUB_OUTPUT"
          exit $status

      - name: Run harness in parallel
        id: parallel
        if: always()
        env:
          EXHAUST_HARNESS_COMMAND_COVERAGE: "1"
        run: |
          START=$(date +%s)
          status=0
          for target in ExploreTests SpecTests; do
            swift package --package-path ExploreHarness explore \
              --instrument ExploreFixture --instrument SpecFixture --instrument SpecTrapProbe \
              --test-target "$target" --configuration debug || status=1
          done
          echo "elapsed=$(( $(date +%s) - START ))" >> "$GITHUB_OUTPUT"
          exit $status

      - name: Report elapsed time
        if: always()
        run: |
          SERIAL="${{ steps.serial.outputs.elapsed }}"
          PARALLEL="${{ steps.parallel.outputs.elapsed }}"
          {
            echo "### Explore harness wall clock"
            echo ""
            echo "| pass | outcome | elapsed |"
            echo "|---|---|---|"
            echo "| serial (\`--no-parallel\`, counters) | ${{ steps.serial.outcome }} | ${SERIAL:-n/a} s |"
            echo "| parallel | ${{ steps.parallel.outcome }} | ${PARALLEL:-n/a} s |"
            if [ -n "$SERIAL" ] && [ -n "$PARALLEL" ] && [ "$PARALLEL" -gt 0 ]; then
              echo ""
              echo "Serial / parallel: $(awk "BEGIN { printf \"%.2f\", $SERIAL / $PARALLEL }")×"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Collect crash reports
        if: failure()
        run: |
          REPORT_DIR="$HOME/Library/Logs/DiagnosticReports"
          if [ -d "$REPORT_DIR" ]; then
            echo "### Crash reports" >> "$GITHUB_STEP_SUMMARY"
            for f in "$REPORT_DIR"/*.ips "$REPORT_DIR"/*.crash; do
              [ -f "$f" ] || continue
              echo "#### $(basename "$f")" >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
              head -80 "$f" >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
            done
          fi

  explore-command-linux:
    runs-on: ubuntu-latest
    container: swift:6.4
    steps:
      - uses: actions/checkout@v6
      - name: Validate explore command consumer workflow
        run: swift -warnings-as-errors -swift-version 6 PluginTests/test_explore_commands.swift
      - name: Verify real campaigns and failure reporting
        run: swift -warnings-as-errors -swift-version 6 PluginTests/run_real_consumer.swift

  explore-command-windows:
    name: Explore command (Windows, experimental)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: compnerd/gha-setup-swift@main
        with:
          branch: swift-6.4.0-release
          tag: 6.4.0-RELEASE
      # The interpreter's JIT cannot resolve Foundation or WinSDK symbols on Windows, so compile each script and run the executable.
      - name: Validate explore command consumer workflow
        shell: pwsh
        run: |
          swiftc -warnings-as-errors -swift-version 6 PluginTests/test_explore_commands.swift -o "$env:RUNNER_TEMP\test_explore_commands.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:RUNNER_TEMP\test_explore_commands.exe"
          exit $LASTEXITCODE
      - name: Verify real campaigns and failure reporting
        shell: pwsh
        run: |
          swiftc -warnings-as-errors -swift-version 6 PluginTests/run_real_consumer.swift -o "$env:RUNNER_TEMP\run_real_consumer.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:RUNNER_TEMP\run_real_consumer.exe"
          exit $LASTEXITCODE
