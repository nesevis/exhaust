name: XCFramework Tests

on: workflow_dispatch

jobs:
  test-xcframework:
    runs-on: xcode-27

    steps:
      - uses: actions/checkout@v6

      - name: Select Xcode 27
        run: sudo xcode-select -s /Applications/Xcode_27.app/Contents/Developer

      - name: Build XCFramework
        run: bash Scripts/build-xcframework.sh

      - name: Run tests (binary xcframework)
        env:
          EXHAUST_RELEASE: "1"
        run: |
          mkdir -p .build
          set +o pipefail
          swift test --build-system native --no-parallel --skip ExhaustCoreTests 2>&1 | tee .build/test-output.txt
          exit ${PIPESTATUS[0]}

      - name: Smoke test artifact from an external package
        run: bash Scripts/verify-xcframework.sh

      - name: Collect crash reports
        if: failure()
        run: |
          REPORT_DIR="$HOME/Library/Logs/DiagnosticReports"
          if [ -d "$REPORT_DIR" ]; then
            echo "### Crash reports" >> "$GITHUB_STEP_SUMMARY"
            for f in "$REPORT_DIR"/*.ips "$REPORT_DIR"/*.crash; do
              [ -f "$f" ] || continue
              echo "#### $(basename "$f")" >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
              head -80 "$f" >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
            done
          fi

      - name: Test report
        if: always()
        run: |
          python3 Scripts/test-report.py .build/test-output.txt
